schema_version: 1
repository: alpercandemir/undertow
oracle_paths:
  - pom.xml
  - config/spotbugs-exclude.xml
  - .github/workflows/ci.yml
  - src/test/java/dev/undertow/TestRepository.java
  - src/test/java/dev/undertow/ContractVerificationTest.java
  - src/test/java/dev/undertow/ContractToolsTest.java
  - src/test/java/dev/undertow/SpringCliTest.java
contracts:
  - id: CONTRACT-EVIDENCE-INTEGRITY
    version: '1'
    owner: repository maintainers
    expectation: Tampered evidence or a mismatched policy binding cannot satisfy an approved contract.
    scope: [src/main/java/dev/undertow/contracts/ContractVerifier.java, src/main/java/dev/undertow/tools/CiEvidence.java]
    verifier: junit
    tests:
      - id: dev.undertow.ContractVerificationTest.tamperingWithBundleReceiptOrBindingCannotBecomeGreen
        sources: [src/test/java/dev/undertow/ContractVerificationTest.java]
  - id: ORACLE-EXECUTION-INTEGRITY
    version: '1'
    owner: repository maintainers
    expectation: Candidate Maven controls cannot silently replace approved test execution.
    scope: [src/main/java/dev/undertow/contracts/ContractPolicy.java]
    verifier: junit
    tests:
      - id: dev.undertow.ContractToolsTest.newlyAddedMavenControlsCannotSilentlyReplaceApprovedExecution
        sources: [src/test/java/dev/undertow/ContractToolsTest.java]
  - id: LOCAL-PREVIEW-IDENTITY
    version: '2'
    owner: repository maintainers
    expectation: Working and staged previews become stale when their captured content changes.
    scope: [src/main/java/dev/undertow/contracts/LocalPreview.java]
    verifier: junit
    tests:
      - id: dev.undertow.ContractToolsTest.localMutationInvalidatesWorkingPreviewButNotUnchangedIndex
        sources: [src/test/java/dev/undertow/ContractToolsTest.java]
  - id: MCP-READ-ONLY
    version: '1'
    owner: repository maintainers
    expectation: Agent requests cannot override host-pinned policy, credentials or evidence, or execute commands through MCP.
    scope: [src/main/java/dev/undertow/contracts/ContractMcp.java]
    verifier: junit
    tests:
      - id: dev.undertow.ContractToolsTest.mcpCannotOverrideHostPolicyCredentialsEvidenceOrExecuteTools
        sources: [src/test/java/dev/undertow/ContractToolsTest.java]

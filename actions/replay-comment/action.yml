name: Undertow Replay Comment
description: Publish replay observations from this pull request's workflow run.
inputs:
  artifact-pattern:
    description: Glob matching the replay artifacts to include from this workflow run.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare report directory
      shell: bash
      id: dest
      run: echo "path=$(mktemp -d "$RUNNER_TEMP/replay-comment.XXXXXXXX")" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: ${{ steps.dest.outputs.path }}
    - name: Update replay comment
      shell: bash
      env:
        REPORT_DIR: ${{ steps.dest.outputs.path }}
        UNDERTOW_GITHUB_TOKEN: ${{ github.token }}
      run: python3 -I "$GITHUB_ACTION_PATH/publish.py"

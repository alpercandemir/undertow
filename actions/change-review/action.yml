name: Undertow Business Change Review
description: Explain business behavior changes from Git source and publish an advisory report.
branding:
  icon: git-pull-request
  color: blue
inputs:
  base:
    description: Full base commit SHA for a manual comparison.
    default: ''
  head:
    description: Full candidate commit SHA for a manual comparison.
    default: ''
  comment:
    description: Create or update the Undertow pull request comment.
    default: 'false'
  artifact-name:
    description: Name for the retained Markdown and JSON reports.
    default: undertow-change-review
outputs:
  status:
    description: findings, no_findings, or unavailable.
    value: ${{ steps.review.outputs.status }}
  base:
    description: Full comparison base SHA, after merge-base selection for pull requests.
    value: ${{ steps.review.outputs.base }}
  head:
    description: Full comparison head SHA.
    value: ${{ steps.review.outputs.head }}
  comment:
    description: published, disabled, skipped, or unavailable.
    value: ${{ steps.review.outputs.comment }}
runs:
  using: composite
  steps:
    - name: Review business changes
      id: review
      shell: bash
      continue-on-error: true
      env:
        UNDERTOW_BASE: ${{ inputs.base }}
        UNDERTOW_HEAD: ${{ inputs.head }}
        UNDERTOW_COMMENT: ${{ inputs.comment }}
        UNDERTOW_GITHUB_TOKEN: ${{ github.token }}
      run: |
        if ! python3 -I "$GITHUB_ACTION_PATH/github_review.py"; then
          printf '## Undertow business change report\n\n**Analysis unavailable.** The review could not start or write its report.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'status=unavailable\ncomment=unavailable\n' >> "$GITHUB_OUTPUT"
        fi

    - name: Retain the Markdown and JSON reports
      if: ${{ steps.review.outputs.directory != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_attempt }}
        path: ${{ steps.review.outputs.directory }}
        if-no-files-found: warn
        retention-days: 14

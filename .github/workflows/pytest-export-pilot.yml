name: Pytest export review pilot

on:
  workflow_dispatch:
    inputs:
      base:
        description: Full merge-base SHA for the reviewed PR
        required: true
      head:
        description: Full trusted PR head SHA with passing CI
        required: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out both comparison revisions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head }}
          path: comparison
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pilot probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Verify the registered probe
        working-directory: trusted
        run: |
          echo '7d0d2d9a8a95170cbe7d2f4fe878307d1f5a3db6f0aeddb65abf796d32f6d075  evaluation/probes/undertow_pytest_export.py' | sha256sum --check
      - uses: alpercandemir/undertow/actions/behavior-replay@7f304ffb2087ee5c5db87ee3ed599f5b0c66e28e
        with:
          repo: comparison
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          probe: trusted/evaluation/probes/undertow_pytest_export.py
          probe-modules: write_test

name: Gemini secret smoke

on:
  push:
    branches: [codex/gemini-secret-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - id: comparison
        run: printf 'base=%s\n' "$(git rev-parse HEAD^^)" >> "$GITHUB_OUTPUT"
      - uses: ./actions/change-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNDERTOW_GEMINI_MODEL: gemini-3.5-flash
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ github.sha }}
          artifact-name: gemini-secret-smoke

name: Gemini secret smoke

on:
  push:
    branches: [codex/gemini-secret-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Gemini API from the Actions runner
        id: api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("GitHub did not supply the Gemini secret.")
          root = "https://generativelanguage.googleapis.com/v1beta/"
          headers = {"x-goog-api-key": key, "Content-Type": "application/json"}
          payload = json.dumps({"contents": [{"parts": [{"text": "Reply with OK."}]}]}).encode()

          def call(path, data=None):
              try:
                  with urlopen(Request(root + path, headers=headers, data=data), timeout=20) as response:
                      result = json.load(response)
                      print(f"{path}: HTTP {response.status}", flush=True)
                      return result
              except HTTPError as error:
                  try:
                      status = json.load(error).get("error", {}).get("status", "")
                  except (ValueError, AttributeError):
                      status = "no JSON error status"
                  print(f"{path}: HTTP {error.code} {status}", flush=True)
              except (URLError, OSError):
                  print(f"{path}: connection or timeout error", flush=True)
              return {}

          call("models?pageSize=1")
          for model in ("gemini-2.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.8-flash"):
              if call(f"models/{model}:generateContent", payload).get("candidates"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"model={model}\n")
                  break
          else:
              raise SystemExit("Gemini returned no candidates on the tested models.")
          PY
      - uses: ./actions/change-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNDERTOW_GEMINI_MODEL: ${{ steps.api.outputs.model }}
        with:
          base: 4d5cc0e07b1de30b67544642d5048a715974ff7b
          head: ${{ github.sha }}
          artifact-name: gemini-secret-smoke

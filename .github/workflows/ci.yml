name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check English content and export publishable files
        run: python3 scripts/public-check.py --export "$RUNNER_TEMP/public-source"
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -eu
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan candidate files and full available history
        run: |
          set -eu
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-source" --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner
  action-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # The evaluation test loads a pinned worker from Git history.
      - name: Run regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/undertow-tests"
          "$RUNNER_TEMP/undertow-tests/bin/python" -m pip install 'pytest==8.3.5'
          "$RUNNER_TEMP/undertow-tests/bin/python" -B -m unittest discover -s tests -v

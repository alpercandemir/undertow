rules:
  - {id: JAVA-TX-001, sections: [21], strength: MUST, kind: contextual, label: BLOCKER, wording: 'Do not assume this.transactionalMethod() will trigger Spring proxy-based transaction interception.'}
  - {id: JAVA-DATA-001, sections: [23], strength: MUST, kind: contextual, label: BLOCKER, wording: 'Enforce critical invariants in the database too. Assume concurrent requests exist.'}
  - {id: JAVA-HTTP-001, sections: [24], strength: MUST, kind: contextual, label: MAJOR, wording: 'Every external network call needs bounded connection, request and read/response timeouts where relevant.'}
  - {id: JAVA-RETRY-001, sections: [24, 38], strength: SHOULD, kind: contextual, label: BLOCKER, wording: 'Make retryable operations idempotent. Assume requests may be retried.'}
  - {id: JAVA-MONEY-001, sections: [12], strength: MUST, kind: contextual, label: MAJOR, wording: 'Do not use double or float for monetary values. Define rounding explicitly. Compare BigDecimal values intentionally.'}
  - {id: JAVA-LOG-001, sections: [25, 36], strength: NEVER, kind: contextual, label: BLOCKER, wording: 'Never log secrets. Do not expose sensitive values in toString.'}
  - {id: JAVA-DEPENDENCY-001, sections: [48], strength: SHOULD, kind: contextual, label: MAJOR, wording: 'Review dependencies deliberately; migration claims require retrieved version-specific evidence.'}
  - {id: JAVA-MODERN-001, sections: [5, 15, 16, 42], strength: SHOULD, kind: optional, label: SUGGESTION, wording: 'Prefer records for immutable data carriers and virtual threads for blocking I/O. Do not ban modern features merely for historical compatibility.'}
  - {id: JAVA-FORMAT-001, sections: [33], strength: MUST, kind: style, label: MINOR, wording: 'Use four spaces per Java block indentation level; do not use two-space levels, tabs or mixed indentation. Follow the configured Spotless google-java-format AOSP style for continuation lines and wrapping. Honor explicit demo/fixture exemptions and ignore whitespace inside comments, strings and text blocks. Report introduced violations as STYLE with LOW risk and recommend running the formatter; spacing alone is not a runtime or business failure.'}

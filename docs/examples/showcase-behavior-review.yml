name: Behavior review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: behavior-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  behavior:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ticket-transfer-candidate
            subject: .
            behavior: ticket-transfer
            example: ''
          - name: refund-retry-candidate
            subject: refund-service
            behavior: refund-retry
            example: ''
          - name: refund-retry-calibration
            subject: refund-service
            behavior: refund-retry
            example: refund-retry
          - name: ticket-transfer-calibration
            subject: .
            behavior: ticket-transfer
            example: ticket-transfer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run existing tests, search, replay and generated regression
        env:
          SUBJECT: ${{ matrix.subject }}
          PROFILE: ${{ matrix.behavior }}
          EXAMPLE: ${{ matrix.example }}
        run: |
          if [ -n "$EXAMPLE" ]; then
            python3 tools/undertow/scripts/behavior-review.py --example "$EXAMPLE" --test-prefix "$SUBJECT" --java-home "$JAVA_HOME" --output .undertow/behavior-review
          else
            python3 tools/undertow/scripts/behavior-review.py --subject "$SUBJECT" --behavior "$PROFILE" --test-prefix "$SUBJECT" --java-home "$JAVA_HOME" --output .undertow/behavior-review
          fi
      - name: Show reviewer decision summary
        if: always()
        run: |
          if [ -f .undertow/behavior-review/summary.md ]; then
            cat .undertow/behavior-review/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Behavior review incomplete\n\nSetup or execution stopped before a report was written. Inspect the failed step; no behavioral conclusion is available.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain replay, regression patch, source snapshots and logs
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behavior-${{ matrix.name }}-${{ github.run_attempt }}
          path: .undertow/behavior-review/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Link evidence from the summary
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: printf '\n[Download complete evidence and proposed patch](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

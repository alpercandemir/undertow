name: Replay a Python API scenario

on:
  workflow_dispatch:
    inputs:
      base:
        description: Full comparison base SHA, usually the PR merge base
        required: true
      head:
        description: Full candidate SHA whose CI passed
        required: true
      probe:
        description: Path to the reviewed probe on the workflow branch
        required: true
      probe_modules:
        description: Space-separated project modules loaded by the probe
        required: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate and its history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head }}
          path: comparison
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the reviewed probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      # Install any project dependencies needed by both revisions here.
      - uses: alpercandemir/undertow/actions/behavior-replay@d06a5e5e892a8b9cf913bdbc6813a0941ecc671d
        with:
          repo: comparison
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          probe: trusted/${{ inputs.probe }}
          probe-modules: ${{ inputs.probe_modules }}

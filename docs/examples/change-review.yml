name: Inspect a source change

on:
  workflow_dispatch:
    inputs:
      base:
        description: Full comparison base SHA, usually the PR merge base
        required: true
      head:
        description: Full candidate SHA
        required: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: alpercandemir/undertow/actions/change-review@v0.5.0
        with:
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
